  <!-- Left building — technology (circuit traces) -->
  <rect x="6" y="18" width="14" height="24" rx="1" fill="none" stroke="#0A66C2" stroke-width="1.5"/>
  <rect x="8" y="20" width="3" height="3" rx="0.5" fill="#0A66C2"/>
  <rect x="13" y="20" width="3" height="3" rx="0.5" fill="#0A66C2"/>
  <rect x="8" y="25" width="3" height="3" rx="0.5" fill="#0A66C2"/>
  <rect x="13" y="25" width="3" height="3" rx="0.5" fill="#0A66C2"/>
  <rect x="8" y="30" width="3" height="3" rx="0.5" fill="#0A66C2"/>
  <rect x="13" y="30" width="3" height="3" rx="0.5" fill="#0A66C2"/>
  <!-- circuit trace line -->
  <line x1="9.5" y1="16" x2="9.5" y2="18" stroke="#0A66C2" stroke-width="1" stroke-dasharray="1.5 1"/>
  <!-- Right building — construction (solid gold block) -->
  <rect x="28" y="12" width="14" height="30" rx="1" fill="#F5A623"/>
  <rect x="30" y="14" width="3" height="4" rx="0.5" fill="#0F1B2E" opacity="0.4"/>
  <rect x="35" y="14" width="3" height="4" rx="0.5" fill="#0F1B2E" opacity="0.4"/>
  <rect x="30" y="20" width="3" height="4" rx="0.5" fill="#0F1B2E" opacity="0.4"/>
  <rect x="35" y="20" width="3" height="4" rx="0.5" fill="#0F1B2E" opacity="0.4"/>
  <rect x="30" y="26" width="3" height="4" rx="0.5" fill="#0F1B2E" opacity="0.4"/>
  <rect x="35" y="26" width="3" height="4" rx="0.5" fill="#0F1B2E" opacity="0.4"/>
  <!-- Ground line -->
  <line x1="4" y1="42" x2="44" y2="42" stroke="#5E6572" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bridge / connection between buildings -->
  <line x1="20" y1="26" x2="28" y2="22" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
